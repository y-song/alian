# Configuration for the embedding analysis (analysis/test/embed.py).
#
# File 1 (pp): Run3 MC -- pp events
# File 2 (oo): Run3 data -- oo events to embed into

# ---- pp (file 1) ---------------------------------------------------------
pp:
  pTHat_min: 5.0
  selections:
    track:
      pt_min: 0.150
  jet_finder:
    R: 0.4
    alg: antikt
    pT_min: 10.0
    eta_max: 0.5

# ---- oo (file 2) -----------------------------------------------------
oo:
  selections:
    event:
      event_sel: sel8Full
      cent_min: 0.
      cent_max: 100.
    track:
      pt_min: 0.150
      track_sel: globalTrack
  jet_finder:              # for clustering the combined (embedded) event
    R: 0.4
    alg: antikt
    pT_min: 10.0
    eta_max: 0.5

# ---- rho estimators -----------------------
bkg_estimator:
  max_eta: 0.9 
  bge_R: 0.4 # jet median

# ---- analysis parameters -----------------------------------------------------
analysis:
  pt_min_pp_jet: 10.0      # minimum pp jet pT to include [GeV]
  pt_min_combined_jet: 20.0
  perpcone_R: 0.4
  mc_fraction_threshold: 0.5

output:
  bins:
    jet_pT:     ['lin',   0, 200, 100]
    residual:   ['lin', -80,  80, 160]
    rho:        ['lin',   0, 100, 100]
    area:       ['lin', -0.2, 2, 44]
    centrality: ['lin',   0, 100, 100]

  histograms:

    # --- 1D jet pT distributions --------------------------------------------

    # pp jets after pp-jet selection
    pp_pT: [1, "pp_pT",
      "pp jet #it{p}_{T};#it{p}_{T}^{pp} (GeV);jet count",
      jet_pT]

    # combined jets before subtracted-pT selection
    combined_pT_preselect: [1, "combined_pT_preselect",
      "Combined jet #it{p}_{T} before selection;#it{p}_{T}^{combined} (GeV);jet count",
      jet_pT]

    sub_pT_preselect: [1, "sub_pT_preselect",
      "Subtracted combined jet #it{p}_{T} before selection;#it{p}_{T}^{sub} (GeV);jet count",
      jet_pT]

    # combined jets after pT_sub >= pt_min_combined_jet
    combined_pT: [1, "combined_pT",
      "Combined jet #it{p}_{T};#it{p}_{T}^{combined} (GeV);jet count",
      jet_pT]

    sub_pT: [1, "sub_pT",
      "Subtracted combined jet #it{p}_{T};#it{p}_{T}^{sub} (GeV);jet count",
      jet_pT]

    # pp jets with a matched combined jet
    pp_pT_matched: [1, "pp_pT_matched",
      "Matched pp jet #it{p}_{T};#it{p}_{T}^{pp} (GeV);jet count",
      jet_pT]


    # --- rho ---------------------------------------------------------------

    cent_rho: [2, "cent_rho",
      "Jet-median #rho vs centrality;#rho (GeV);centrality (%)",
      rho, centrality]


    # --- all selected combined jets ----------------------------------------

    combined_pT_sub_pT: [2, "combined_pT_sub_pT",
      "Combined jet #it{p}_{T} vs subtracted #it{p}_{T};#it{p}_{T}^{sub} (GeV);#it{p}_{T}^{combined} (GeV)",
      jet_pT, jet_pT]

    combined_area_sub_pT: [2, "combined_area_sub_pT",
      "Combined jet area vs subtracted #it{p}_{T};#it{p}_{T}^{sub} (GeV);jet area",
      jet_pT, area]


    # --- matched combined jets ---------------------------------------------

    combined_pT_sub_pT_matched: [2, "combined_pT_sub_pT_matched",
      "Combined jet #it{p}_{T} vs subtracted #it{p}_{T} (matched);#it{p}_{T}^{sub} (GeV);#it{p}_{T}^{combined} (GeV)",
      jet_pT, jet_pT]

    combined_area_sub_pT_matched: [2, "combined_area_sub_pT_matched",
      "Combined jet area vs subtracted #it{p}_{T} (matched);#it{p}_{T}^{sub} (GeV);jet area",
      jet_pT, area]

    sub_pT_pp_pT_matched: [2, "sub_pT_pp_pT_matched",
      "Subtracted combined jet #it{p}_{T} vs pp jet #it{p}_{T} (matched);#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} (GeV)",
      jet_pT, jet_pT]

    residual_pp_pT_matched: [2, "residual_pp_pT_matched",
      "Residual vs pp jet #it{p}_{T} (matched);#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} - #it{p}_{T}^{pp} (GeV)",
      jet_pT, residual]

    residual_sub_pT_matched: [2, "residual_sub_pT_matched",
      "Residual vs subtracted combined jet #it{p}_{T} (matched);#it{p}_{T}^{sub} (GeV);#it{p}_{T}^{sub} - #it{p}_{T}^{pp} (GeV)",
      jet_pT, residual]