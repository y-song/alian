# Configuration for the embedding analysis (analysis/test/embed.py).
#
# File 1 (pp): Run3 data -- source of pp jets
# File 2 (oo): Run3 data -- oo events to embed into
#
# Both rho estimators (grid median and jet median) are run on every combined
# event; area subtraction with each gives delta_pT histograms for comparison.

# ---- pp (file 1) ---------------------------------------------------------
pp:
  selections:
    event:
      event_sel: sel8
    track:
      pt_min: 0.150
      track_sel: globalTrack
  jet_finder:
    R: 0.4
    alg: antikt
    pT_min: 10.0
    eta_max: 0.5

# ---- oo (file 2) -----------------------------------------------------
oo:
  selections:
    event:
      event_sel: sel8Full
      cent_min: 0.
      cent_max: 10.
    track:
      pt_min: 0.150
      track_sel: globalTrack
  jet_finder:              # for clustering the combined (embedded) event
    R: 0.4
    alg: antikt
    pT_min: 10.0
    eta_max: 0.5

# ---- rho estimators (both run on every combined event) -----------------------
bkg_estimator:
  max_eta: 0.9
  # grid median
  bge_rho_grid_size: 0.5
  # jet median
  bge_jet_R: 0.2

# ---- analysis parameters -----------------------------------------------------
analysis:
  pt_min_pp_jet: 10.0      # minimum pp jet pT to include [GeV]
  pt_min_combined_jet: 10.0
  max_match_dR: 0.4        # maximum delta-R for truth<->embedded jet matching

output:
  bins:
    jet_pT:     ['lin',   0, 200, 100]
    delta_pT:   ['lin', -80,  80, 160]
    rho:        ['lin',   0, 100, 100]
    area:       ['lin',  -0.2,  2,  44]
    centrality: ['lin',   0, 100, 100]
  histograms:
    # combined jet pT vs pp jet pT (y=0 when no match found)
    combined_jet_pT_pp_jet_pT: [2, "combined_jet_pT_pp_jet_pT",
      "Combined jet #it{p}_{T} vs pp jet #it{p}_{T};#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{combined} (GeV)",
      jet_pT, jet_pT]
    # combined jet area vs pp jet pT (y=-0.1 when no match found)
    combined_jet_A_pp_jet_pT: [2, "combined_jet_A_pp_jet_pT",
      "Combined jet area vs pp jet #it{p}_{T};#it{p}_{T}^{pp} (GeV);jet area",
      jet_pT, area]
    # delta_pT = (pt_combined - rho*A) - pt_pp for each rho estimator (-pt_pp when no match)
    delta_pT_grid_pp_jet_pT: [2, "delta_pT_grid_pp_jet_pT",
      "Grid-median #rho;#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} - #it{p}_{T}^{pp} (GeV)",
      jet_pT, delta_pT]
    delta_pT_jet_pp_jet_pT:  [2, "delta_pT_jet_pp_jet_pT",
      "Jet-median #rho;#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} - #it{p}_{T}^{pp} (GeV)",
      jet_pT, delta_pT]
    sub_pT_grid_pp_jet_pT: [2, "sub_pT_grid_pp_jet_pT",
      "Grid-median #rho;#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} (GeV)",
      jet_pT, jet_pT]
    sub_pT_jet_pp_jet_pT:  [2, "sub_pT_jet_pp_jet_pT",
      "Jet-median #rho;#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} (GeV)",
      jet_pT, jet_pT]
    delta_pT_grid_pp_jet_pT_matched: [2, "delta_pT_grid_pp_jet_pT_matched",
      "Grid-median #rho (matched);#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} - #it{p}_{T}^{pp} (GeV)",
      jet_pT, delta_pT]
    delta_pT_jet_pp_jet_pT_matched:  [2, "delta_pT_jet_pp_jet_pT_matched",
      "Jet-median #rho (matched);#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} - #it{p}_{T}^{pp} (GeV)",
      jet_pT, delta_pT]
    sub_pT_grid_pp_jet_pT_matched: [2, "sub_pT_grid_pp_jet_pT_matched",
      "Grid-median #rho (matched);#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} (GeV)",
      jet_pT, jet_pT]
    sub_pT_jet_pp_jet_pT_matched:  [2, "sub_pT_jet_pp_jet_pT_matched",
      "Jet-median #rho (matched);#it{p}_{T}^{pp} (GeV);#it{p}_{T}^{sub} (GeV)",
      jet_pT, jet_pT]
    # rho vs OO centrality
    cent_rho_grid: [2, "cent_rho_grid", "Grid-median #rho vs centrality;#rho (GeV);centrality (%)", rho, centrality]
    cent_rho_jet:  [2, "cent_rho_jet",  "Jet-median #rho vs centrality;#rho (GeV);centrality (%)",  rho, centrality]
